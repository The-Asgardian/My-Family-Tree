<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="A simple persistent family tree." />
  <title>Family Tree</title>
  <link rel="stylesheet" href="./src/styles.css?v=20260812-generations" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="family-title ghost-button" id="familyMenuButton" type="button" aria-label="Fit family tree in view">
        <span class="brand-mark" aria-hidden="true">⌘</span>
        <span id="familyName">Family Tree</span>
      </button>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="globalSearch" type="search" placeholder="Search people…" autocomplete="off" aria-label="Search people" />
        <span class="shortcut-hint">⌘K</span>
        <div id="searchResults" class="search-results" hidden></div>
      </div>

      <div class="header-actions">
        <span id="connectionStatus" class="connection-status waiting" aria-live="polite">Connecting…</span>
        <button id="addPersonButton" class="primary-button" type="button"><span>＋</span> Add person</button>
      </div>
    </header>

    <main class="workspace">
      <section class="tree-pane" aria-label="Family tree">
        <nav class="view-tabs" aria-label="Tree views">
          <button class="view-tab active" data-view="family" type="button">♧ <span>Family</span></button>
          <button class="view-tab" data-view="ancestors" type="button">↟ <span>Ancestors</span></button>
          <button class="view-tab" data-view="descendants" type="button">↡ <span>Descendants</span></button>
          <button class="view-tab" data-view="list" type="button">☷ <span>List</span></button>
        </nav>

        <div class="tree-action-buttons">
          <button id="generationBandsButton" class="secondary-button generation-toggle active" type="button" aria-pressed="true">▦ Generations</button>
          <button id="autoLayoutButton" class="secondary-button" type="button">↔ Auto arrange</button>
        </div>

        <div id="treeViewport" class="tree-viewport" tabindex="0">
          <div id="treeStage" class="tree-stage" aria-live="polite">
            <div id="generationLayer" class="generation-layer" aria-hidden="true"></div>
            <svg id="relationshipLayer" class="relationship-layer" aria-hidden="true"></svg>
            <div id="nodeLayer" class="node-layer"></div>
          </div>
          <div id="emptyState" class="empty-state" hidden>
            <h2>Unable to load family tree</h2>
            <p>Please check your connection and configuration.</p>
          </div>
        </div>

        <aside class="zoom-toolbar" aria-label="Tree controls">
          <button id="centreButton" class="tool-button" type="button" title="Centre selected person" aria-label="Centre selected person">◎</button>
          <span class="tool-divider"></span>
          <button id="zoomInButton" class="tool-button" type="button" title="Zoom in" aria-label="Zoom in">＋</button>
          <output id="zoomValue">100%</output>
          <button id="zoomOutButton" class="tool-button" type="button" title="Zoom out" aria-label="Zoom out">−</button>
          <span class="tool-divider"></span>
          <button id="fitButton" class="tool-button" type="button" title="Fit tree" aria-label="Fit tree">⌗</button>
        </aside>

        <button id="mobileDetailsButton" class="mobile-details-button" type="button" hidden>View details</button>
      </section>

      <aside id="detailsPanel" class="details-panel" aria-label="Selected person details">
        <button id="closeDetailsButton" class="panel-close icon-button" type="button" aria-label="Close details">×</button>
        <div id="detailsContent"></div>
      </aside>
    </main>
  </div>

  <dialog id="relationshipDialog" class="modal relationship-modal">
    <div class="modal-head">
      <div>
        <h2 id="relationshipTitle">Add a relative</h2>
        <p id="relationshipSubtitle"></p>
      </div>
      <button class="icon-button modal-close" type="button" data-close-dialog="relationshipDialog">×</button>
    </div>
    <div class="relationship-grid">
      <button type="button" data-relationship="parent"><span>♙</span><b>Parent</b></button>
      <button type="button" data-relationship="partner"><span>♡</span><b>Partner</b></button>
      <button type="button" data-relationship="sibling"><span>♧</span><b>Sibling</b></button>
      <button type="button" data-relationship="child"><span>♙</span><b>Child</b></button>
    </div>
  </dialog>

  <dialog id="personDialog" class="modal person-modal">
    <div class="modal-head">
      <div>
        <h2 id="personDialogTitle">Add person</h2>
        <p id="personDialogSubtitle">Add their basic details. You can add more later.</p>
      </div>
      <button class="icon-button modal-close" type="button" data-close-dialog="personDialog">×</button>
    </div>
    <form id="personForm">
      <div class="person-form-grid">
        <label class="photo-upload" for="personPhotoInput">
          <input id="personPhotoInput" type="file" accept="image/*" hidden />
          <span id="photoPreview" class="photo-preview"><span>＋</span><small>Add photo</small></span>
        </label>
        <div class="form-fields">
          <div class="name-fields">
            <label>First name(s)<input id="personFirstNameInput" name="firstName" required autocomplete="given-name" /></label>
            <label>Gender<select id="personGenderInput" name="gender" required><option value="">Choose…</option><option value="male">Male</option><option value="female">Female</option></select></label>
            <label>Middle name<input id="personMiddleNameInput" name="middleName" readonly aria-describedby="middleNameHint" /></label>
            <label>Last name <small>(automatic)</small><input id="personLastNameInput" name="lastName" autocomplete="family-name" readonly aria-describedby="surnameHint" /></label>
          </div>
          <small id="middleNameHint" class="field-hint">Singh or Kaur is set automatically from gender.</small>
          <small id="surnameHint" class="field-hint">Automatic surname · Hayre family root</small>
          <label>Date of birth<input id="personDobInput" name="dob" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="bday" /></label>
          <label>Approximate age<input id="personAgeInput" name="estimatedAge" type="number" min="0" max="130" inputmode="numeric" /></label>
          <label class="switch-row"><span>Living</span><input id="personLivingInput" name="living" type="checkbox" checked /></label>
        </div>
      </div>
      <details class="more-details">
        <summary>＋ More details</summary>
        <div class="expanded-fields">
          <label>Birthplace<input id="personBirthplaceInput" name="birthplace" /></label>
          <label>Date of death<input id="personDeathInput" name="deathDate" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" /></label>
          <label>About<textarea id="personAboutInput" name="about" rows="3"></textarea></label>
        </div>
      </details>
      <div id="formStatus" class="form-status" role="status"></div>
      <div class="modal-actions">
        <button class="secondary-button" type="button" data-close-dialog="personDialog">Cancel</button>
        <button class="primary-button" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <script type="module" src="./src/app.js?v=20260812-generations"></script>
</body>
</html>
